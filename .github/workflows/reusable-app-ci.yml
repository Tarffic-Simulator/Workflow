# =============================================================================
# WORKFLOW REUTILIZABLE — App Móvil CI (Expo / React Native)
#
# Propósito: Define el pipeline de CI para el repositorio mobile-app.
# Cómo usarlo desde el repo mobile-app (crear .github/workflows/ci.yml allá):
#
#   jobs:
#     ci:
#       uses: Tarffic-Simulator/Workflow/.github/workflows/reusable-app-ci.yml@main
#       with:
#         node-version: "20"
#       secrets: inherit
#
# =============================================================================
name: "[Reusable] App Móvil CI"

on:
  workflow_call:
    inputs:
      node-version:
        description: "Versión de Node.js"
        type: string
        default: "20"
        required: false
      run-lint:
        description: "Ejecutar lint"
        type: boolean
        default: true
        required: false
      run-tests:
        description: "Ejecutar tests"
        type: boolean
        default: true
        required: false

jobs:
  # ---------------------------------------------------------------------------
  # JOB: Lint — verifica formato y calidad de código
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    if: ${{ inputs.run-lint }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (Expo)
        run: npx expo lint

  # ---------------------------------------------------------------------------
  # JOB: Test — corre la suite de tests
  # ---------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    if: ${{ inputs.run-tests }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest --watchAll=false --passWithNoTests

  # ---------------------------------------------------------------------------
  # JOB: Type check — verifica tipos TypeScript (si el proyecto lo usa)
  # ---------------------------------------------------------------------------
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
