# =============================================================================
# ORCHESTRATOR — Coordinador central del ecosistema Tarffic-Simulator
#
# Propósito: Recibe eventos de Engine/Backend cuando hay un push, y:
#   Job 1 — Registra el commit (quién, qué branch)
#   Job 2 — Hace git pull en el servidor (self-hosted runner)
#   Job 3 — Reinicia el servicio en ese servidor
#
# Cómo enviar un evento desde otro repo (ya está en templates/*/ci.yml):
#   event-type: engine-push  |  backend-push  |  app-push
#   client-payload: { "sha", "branch", "actor" }
#
# Secreto requerido en este repo:
#   DEVOPS_DISPATCH_TOKEN — PAT con contents:write sobre Workflow
# =============================================================================
name: Orchestrator

on:
  repository_dispatch:
    types:
      - engine-push
      - backend-push
      - app-push

  workflow_dispatch:
    inputs:
      service:
        description: "Servicio a procesar"
        required: true
        type: choice
        options:
          - engine
          - backend
          - app-movil

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — Cargar config y registrar el commit
  # Corre en GitHub (nube). Lee variables.yml y escribe el resumen del evento.
  # ---------------------------------------------------------------------------
  log-event:
    name: "Job 1: Log Event"
    runs-on: ubuntu-latest
    outputs:
      triggered_service: ${{ steps.context.outputs.triggered_service }}
      triggered_branch:  ${{ steps.context.outputs.triggered_branch }}
      triggered_sha:     ${{ steps.context.outputs.triggered_sha }}
      triggered_actor:   ${{ steps.context.outputs.triggered_actor }}
      engine_path:       ${{ steps.config.outputs.engine_path }}
      engine_service:    ${{ steps.config.outputs.engine_service }}
      backend_path:      ${{ steps.config.outputs.backend_path }}
      backend_service:   ${{ steps.config.outputs.backend_service }}
      app_path:          ${{ steps.config.outputs.app_path }}
      app_service:       ${{ steps.config.outputs.app_service }}
      runner_label:      ${{ steps.config.outputs.runner_label }}

    steps:
      - name: Checkout Workflow repo
        uses: actions/checkout@v4

      - name: Parse config/variables.yml
        id: config
        run: |
          CONFIG="config/variables.yml"
          echo "engine_path=$(yq '.server.engine.repo_path' $CONFIG)"           >> $GITHUB_OUTPUT
          echo "engine_service=$(yq '.server.engine.service_name' $CONFIG)"   >> $GITHUB_OUTPUT
          echo "backend_path=$(yq '.server.backend.repo_path' $CONFIG)"       >> $GITHUB_OUTPUT
          echo "backend_service=$(yq '.server.backend.service_name' $CONFIG)" >> $GITHUB_OUTPUT
          echo "app_path=$(yq '.server.app_movil.repo_path' $CONFIG)"         >> $GITHUB_OUTPUT
          echo "app_service=$(yq '.server.app_movil.service_name' $CONFIG)"   >> $GITHUB_OUTPUT
          echo "runner_label=$(yq '.server.runner_label' $CONFIG)"            >> $GITHUB_OUTPUT

      - name: Determine event context
        id: context
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "triggered_service=${{ github.event.action }}"                >> $GITHUB_OUTPUT
            echo "triggered_branch=${{ github.event.client_payload.branch }}"  >> $GITHUB_OUTPUT
            echo "triggered_sha=${{ github.event.client_payload.sha }}"        >> $GITHUB_OUTPUT
            echo "triggered_actor=${{ github.event.client_payload.actor }}"    >> $GITHUB_OUTPUT
          else
            echo "triggered_service=${{ inputs.service }}"   >> $GITHUB_OUTPUT
            echo "triggered_branch=manual"                   >> $GITHUB_OUTPUT
            echo "triggered_sha=manual"                      >> $GITHUB_OUTPUT
            echo "triggered_actor=${{ github.actor }}"       >> $GITHUB_OUTPUT
          fi

      - name: Write event summary
        run: |
          echo "## Orchestrator — Evento recibido" >> $GITHUB_STEP_SUMMARY
          echo "| Campo      | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Servicio   | \`${{ steps.context.outputs.triggered_service }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch     | \`${{ steps.context.outputs.triggered_branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ steps.context.outputs.triggered_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor      | @${{ steps.context.outputs.triggered_actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp  | $(date -u '+%Y-%m-%d %H:%M:%S') UTC |" >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # JOB 2 — Git pull en el servidor
  # Corre en el self-hosted runner.
  # Baja el código nuevo al directorio correcto según el servicio que pusheó.
  # ---------------------------------------------------------------------------
  git-pull:
    name: "Job 2: Git Pull"
    runs-on: ${{ needs.log-event.outputs.runner_label }}
    needs: log-event

    steps:
      - name: Pull Engine
        if: ${{ needs.log-event.outputs.triggered_service == 'engine-push' || needs.log-event.outputs.triggered_service == 'engine' }}
        run: |
          cd "${{ needs.log-event.outputs.engine_path }}"
          git pull origin ${{ needs.log-event.outputs.triggered_branch }}

      - name: Pull Backend
        if: ${{ needs.log-event.outputs.triggered_service == 'backend-push' || needs.log-event.outputs.triggered_service == 'backend' }}
        run: |
          cd "${{ needs.log-event.outputs.backend_path }}"
          git pull origin ${{ needs.log-event.outputs.triggered_branch }}

      - name: Pull App Móvil
        if: ${{ needs.log-event.outputs.triggered_service == 'app-push' || needs.log-event.outputs.triggered_service == 'app-movil' }}
        run: |
          cd "${{ needs.log-event.outputs.app_path }}"
          git pull origin ${{ needs.log-event.outputs.triggered_branch }}

  # ---------------------------------------------------------------------------
  # JOB 3 — Reiniciar el servicio en el servidor
  # Corre también en el self-hosted runner, después del git pull.
  # El nombre del servicio viene de config/variables.yml → server.*.service_name
  # ---------------------------------------------------------------------------
  restart-service:
    name: "Job 3: Restart Service"
    runs-on: ${{ needs.log-event.outputs.runner_label }}
    needs: [log-event, git-pull]

    steps:
      - name: Restart Engine service
        if: ${{ needs.log-event.outputs.triggered_service == 'engine-push' || needs.log-event.outputs.triggered_service == 'engine' }}
        run: |
          sudo systemctl restart "${{ needs.log-event.outputs.engine_service }}"
          sudo systemctl status  "${{ needs.log-event.outputs.engine_service }}"

      - name: Restart Backend service
        if: ${{ needs.log-event.outputs.triggered_service == 'backend-push' || needs.log-event.outputs.triggered_service == 'backend' }}
        run: |
          sudo systemctl restart "${{ needs.log-event.outputs.backend_service }}"
          sudo systemctl status  "${{ needs.log-event.outputs.backend_service }}"

      - name: Restart App Móvil service
        if: ${{ needs.log-event.outputs.triggered_service == 'app-push' || needs.log-event.outputs.triggered_service == 'app-movil' }}
        run: |
          sudo systemctl restart "${{ needs.log-event.outputs.app_service }}"
          sudo systemctl status  "${{ needs.log-event.outputs.app_service }}"
